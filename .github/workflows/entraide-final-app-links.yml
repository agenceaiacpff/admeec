name: Entraide Monde Android 1.0.4 Exact Build

on:
  push:
    branches: [entraide-android-runner-probe]
    paths:
      - ".github/workflows/entraide-final-app-links.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create exact Entraide Monde 1.0.4 Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf entraide dist published-final-v104
          mkdir -p entraide/app/src/main/java/org/aiac/entraidemonde
          mkdir -p entraide/app/src/main/res/values
          mkdir -p entraide/app/src/main/res/drawable
          cat > "entraide/settings.gradle.kts" <<'EOF_SRC_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EntraideMonde"
          include(":app")
          EOF_SRC_0
          cat > "entraide/build.gradle.kts" <<'EOF_SRC_1'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF_SRC_1
          cat > "entraide/gradle.properties" <<'EOF_SRC_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_SRC_2
          cat > "entraide/app/build.gradle.kts" <<'EOF_SRC_3'
          plugins {
              id("com.android.application")
          }
          
          android {
              namespace = "org.aiac.entraidemonde"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "org.aiac.entraidemonde"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 4
                  versionName = "1.0.4"
              }
          
              buildTypes {
                  debug {
                      applicationIdSuffix = ""
                      versionNameSuffix = "-test"
                  }
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }
          EOF_SRC_3
          cat > "entraide/app/proguard-rules.pro" <<'EOF_SRC_4'
          -keep class org.aiac.entraidemonde.MainActivity { *; }
          EOF_SRC_4
          cat > "entraide/app/src/main/AndroidManifest.xml" <<'EOF_SRC_5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/entraide_logo"
                  android:roundIcon="@drawable/entraide_logo"
                  android:label="Entraide Monde"
                  android:theme="@style/Theme.EntraideMonde">
                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements" />
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="entraide.aiac-cm.org" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_SRC_5
          cat > "entraide/app/src/main/java/org/aiac/entraidemonde/MainActivity.java" <<'EOF_SRC_6'
          package org.aiac.entraidemonde;
          
          import android.Manifest;
          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          import java.util.ArrayList;
          import java.util.List;
          
          public class MainActivity extends Activity {
              private static final String APP_URL = "https://entraide.aiac-cm.org/";
              private static final String APP_HOST = "entraide.aiac-cm.org";
              private static final int REQ_FILES = 4101;
              private static final int REQ_MEDIA = 4102;
              private static final int REQ_LOCATION = 4103;
              private static final int REQ_NOTIFICATIONS = 4104;
              private static final String NOTIFICATION_CHANNEL_ID = "entraide";
              private static int nextNotificationId = 1000;
          
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private PermissionRequest pendingMediaRequest;
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(244, 247, 245));
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  setContentView(webView);
          
                  configureWebView();
                  configureNotifications();
          
                  if (savedInstanceState == null) {
                      webView.loadUrl(resolveLaunchUrl(getIntent()));
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }
          
              private String resolveLaunchUrl(Intent intent) {
                  if (intent == null) return APP_URL;
                  Uri data = intent.getData();
                  if (data == null) return APP_URL;
                  String scheme = data.getScheme() == null ? "" : data.getScheme();
                  String host = data.getHost() == null ? "" : data.getHost();
                  if ("https".equalsIgnoreCase(scheme) && APP_HOST.equalsIgnoreCase(host)) {
                      return data.toString();
                  }
                  return APP_URL;
              }
          
              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  if (webView != null) {
                      webView.loadUrl(resolveLaunchUrl(intent));
                  }
              }
          
              private void configureWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setUserAgentString(settings.getUserAgentString() + " EntraideMondeAndroid/1.0");
          
                  webView.addJavascriptInterface(new EntraideAndroidBridge(), "EntraideAndroid");
          
                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);
          
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme() == null ? "" : uri.getScheme();
                          String host = uri.getHost() == null ? "" : uri.getHost();
          
                          if (("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme))
                                  && APP_HOST.equalsIgnoreCase(host)) {
                              return false;
                          }
          
                          if ("about".equalsIgnoreCase(scheme)) {
                              return false;
                          }
          
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (ActivityNotFoundException ignored) {
                          }
                          return true;
                      }
          
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (!request.isForMainFrame()) return;
          
                          String html = "<!doctype html><html lang='fr'><meta name='viewport' content='width=device-width,initial-scale=1'>"
                                  + "<body style='font-family:sans-serif;background:#f4f7f5;color:#18211d;padding:32px'>"
                                  + "<h2 style='color:#35104f'>Entraide Monde</h2>"
                                  + "<p>Impossible de charger la plateforme. Vérifiez votre connexion Internet.</p>"
                                  + "<button style='padding:12px 18px;border:0;border-radius:10px;background:#137657;color:white;font-weight:700' "
                                  + "onclick='location.href=\"" + APP_URL + "\"'>Réessayer</button></body></html>";
                          view.loadDataWithBaseURL(APP_URL, html, "text/html", "UTF-8", null);
                      }
                  });
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> newCallback,
                              FileChooserParams params
                      ) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = newCallback;
          
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
          
                          String[] accept = params.getAcceptTypes();
                          List<String> mimeTypes = new ArrayList<>();
                          if (accept != null) {
                              for (String type : accept) {
                                  if (type != null && !type.trim().isEmpty() && type.contains("/")) {
                                      mimeTypes.add(type);
                                  }
                              }
                          }
                          if (!mimeTypes.isEmpty()) {
                              intent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes.toArray(new String[0]));
                          }
                          intent.putExtra(
                                  Intent.EXTRA_ALLOW_MULTIPLE,
                                  params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE
                          );
          
                          try {
                              startActivityForResult(intent, REQ_FILES);
                              return true;
                          } catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              return false;
                          }
                      }
          
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> handleWebPermissionRequest(request));
                      }
          
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback
                      ) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                                  == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                              return;
                          }
          
                          pendingGeoOrigin = origin;
                          pendingGeoCallback = callback;
                          requestPermissions(
                                  new String[]{Manifest.permission.ACCESS_FINE_LOCATION},
                                  REQ_LOCATION
                          );
                      }
                  });
          
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                      } catch (ActivityNotFoundException ignored) {
                      }
                  });
              }
          
              private void configureNotifications() {
                  NotificationManager manager = getSystemService(NotificationManager.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              NOTIFICATION_CHANNEL_ID,
                              "Entraide Monde",
                              NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Alertes importantes Entraide Monde");
                      channel.enableVibration(true);
                      channel.setShowBadge(true);
                      manager.createNotificationChannel(channel);
                  }
          
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.POST_NOTIFICATIONS},
                              REQ_NOTIFICATIONS
                      );
                  }
              }
          
              private class EntraideAndroidBridge {
                  @JavascriptInterface
                  public void notify(String title, String body, String url) {
                      runOnUiThread(() -> showNativeNotification(title, body, url));
                  }
              }
          
              private void showNativeNotification(String title, String body, String url) {
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      return;
                  }
          
                  String safeTitle = (title == null || title.trim().isEmpty()) ? "Entraide Monde" : title.trim();
                  String safeBody = body == null ? "" : body.trim();
                  String targetUrl = APP_URL;
          
                  try {
                      Uri candidate = Uri.parse(url == null ? "" : url);
                      String scheme = candidate.getScheme() == null ? "" : candidate.getScheme();
                      String host = candidate.getHost() == null ? "" : candidate.getHost();
                      if ("https".equalsIgnoreCase(scheme) && APP_HOST.equalsIgnoreCase(host)) {
                          targetUrl = candidate.toString();
                      }
                  } catch (Exception ignored) {
                  }
          
                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setAction(Intent.ACTION_VIEW);
                  openIntent.setData(Uri.parse(targetUrl));
                  openIntent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
          
                  PendingIntent contentIntent = PendingIntent.getActivity(
                          this,
                          nextNotificationId,
                          openIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
          
                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, NOTIFICATION_CHANNEL_ID)
                          : new Notification.Builder(this);
          
                  builder
                          .setSmallIcon(org.aiac.entraidemonde.R.drawable.ic_launcher)
                          .setContentTitle(safeTitle)
                          .setContentText(safeBody)
                          .setStyle(new Notification.BigTextStyle().bigText(safeBody))
                          .setContentIntent(contentIntent)
                          .setAutoCancel(true)
                          .setWhen(System.currentTimeMillis())
                          .setShowWhen(true)
                          .setNumber(1)
                          .setPriority(Notification.PRIORITY_HIGH);
          
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                      builder.setDefaults(Notification.DEFAULT_ALL);
                  }
          
                  NotificationManager manager = getSystemService(NotificationManager.class);
                  manager.notify(nextNotificationId++, builder.build());
              }
          
              private void handleWebPermissionRequest(PermissionRequest request) {
                  List<String> androidPermissions = new ArrayList<>();
          
                  for (String resource : request.getResources()) {
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)
                              && checkSelfPermission(Manifest.permission.CAMERA)
                              != PackageManager.PERMISSION_GRANTED) {
                          androidPermissions.add(Manifest.permission.CAMERA);
                      }
          
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)
                              && checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                              != PackageManager.PERMISSION_GRANTED) {
                          androidPermissions.add(Manifest.permission.RECORD_AUDIO);
                      }
                  }
          
                  if (androidPermissions.isEmpty()) {
                      request.grant(request.getResources());
                      return;
                  }
          
                  pendingMediaRequest = request;
                  requestPermissions(androidPermissions.toArray(new String[0]), REQ_MEDIA);
              }
          
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
          
                  if (requestCode == REQ_LOCATION && pendingGeoCallback != null) {
                      boolean granted = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                              == PackageManager.PERMISSION_GRANTED;
                      pendingGeoCallback.invoke(pendingGeoOrigin, granted, false);
                      pendingGeoCallback = null;
                      pendingGeoOrigin = null;
                      return;
                  }
          
                  if (requestCode == REQ_MEDIA && pendingMediaRequest != null) {
                      List<String> grantedResources = new ArrayList<>();
          
                      for (String resource : pendingMediaRequest.getResources()) {
                          if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)
                                  && checkSelfPermission(Manifest.permission.CAMERA)
                                  == PackageManager.PERMISSION_GRANTED) {
                              grantedResources.add(resource);
                          }
          
                          if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)
                                  && checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                                  == PackageManager.PERMISSION_GRANTED) {
                              grantedResources.add(resource);
                          }
                      }
          
                      if (grantedResources.isEmpty()) {
                          pendingMediaRequest.deny();
                      } else {
                          pendingMediaRequest.grant(grantedResources.toArray(new String[0]));
                      }
          
                      pendingMediaRequest = null;
                  }
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILES && fileCallback != null) {
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }
          
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          
              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF_SRC_6
          cat > "entraide/app/src/main/res/values/strings.xml" <<'EOF_SRC_7'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Entraide Monde</string>
              <string name="asset_statements" translatable="false">[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"web\",\"site\":\"https://entraide.aiac-cm.org\"}}]</string>
          </resources>
          EOF_SRC_7
          cat > "entraide/app/src/main/res/values/styles.xml" <<'EOF_SRC_8'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.EntraideMonde" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#F4F7F5</item>
                  <item name="android:statusBarColor">#35104F</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:colorAccent">#137657</item>
              </style>
          </resources>
          EOF_SRC_8
          cat > "entraide/app/src/main/res/drawable/ic_launcher.xml" <<'EOF_SRC_9'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
