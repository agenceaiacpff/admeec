name: Entraide Final Lightweight Android Build
on:
  push:
    branches: [entraide-android-runner-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Create Android project
        run: |
          mkdir -p entraide/app/src/main/java/org/aiac/entraidemonde
          mkdir -p entraide/app/src/main/res/values
          mkdir -p entraide/app/src/main/res/drawable
          cat > entraide/settings.gradle.kts <<'EOF_SETTINGS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EntraideMonde"
          include(":app")
          EOF_SETTINGS
          cat > entraide/build.gradle.kts <<'EOF_ROOT'
          plugins { id("com.android.application") version "8.7.3" apply false }
          EOF_ROOT
          cat > entraide/gradle.properties <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_PROPS
          cat > entraide/app/build.gradle.kts <<'EOF_APP'
          plugins { id("com.android.application") }
          android {
              namespace = "org.aiac.entraidemonde"
              compileSdk = 35
              defaultConfig {
                  applicationId = "org.aiac.entraidemonde"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.0.2"
              }
              buildTypes {
                  debug {
                      applicationIdSuffix = ""
                      versionNameSuffix = "-test"
                  }
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }
          EOF_APP
          cat > entraide/app/proguard-rules.pro <<'EOF_PROGUARD'
          -keep class org.aiac.entraidemonde.MainActivity { *; }
          EOF_PROGUARD
          cat > entraide/app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />

    <application
        android:allowBackup="true"
        android:usesCleartextTraffic="false"
        android:hardwareAccelerated="true"
        android:icon="@drawable/ic_launcher"
        android:roundIcon="@drawable/ic_launcher"
        android:label="Entraide Monde"
        android:theme="@style/Theme.EntraideMonde">
        <activity
            android:name=".MainActivity"
            android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode"
            android:exported="true"
            android:launchMode="singleTask">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="https" android:host="entraide.aiac-cm.org" />
            </intent-filter>
        </activity>
    </application>
</manifest>

          EOF_MANIFEST
          cat > entraide/app/src/main/java/org/aiac/entraidemonde/MainActivity.java <<'EOF_JAVA'
package org.aiac.entraidemonde;

import android.Manifest;
import android.app.Activity;
import android.content.ActivityNotFoundException;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.graphics.Color;
import android.net.Uri;
import android.os.Bundle;
import android.view.ViewGroup;
import android.webkit.CookieManager;
import android.webkit.GeolocationPermissions;
import android.webkit.PermissionRequest;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceError;
import android.webkit.WebResourceRequest;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

import java.util.ArrayList;
import java.util.List;

public class MainActivity extends Activity {
    private static final String APP_URL = "https://entraide.aiac-cm.org/";
    private static final String APP_HOST = "entraide.aiac-cm.org";
    private static final int REQ_FILES = 4101;
    private static final int REQ_MEDIA = 4102;
    private static final int REQ_LOCATION = 4103;

    private WebView webView;
    private ValueCallback<Uri[]> fileCallback;
    private PermissionRequest pendingMediaRequest;
    private GeolocationPermissions.Callback pendingGeoCallback;
    private String pendingGeoOrigin;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);
        webView.setBackgroundColor(Color.rgb(244, 247, 245));
        webView.setLayoutParams(new ViewGroup.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
        ));
        setContentView(webView);

        configureWebView();

        if (savedInstanceState == null) {
            webView.loadUrl(resolveLaunchUrl(getIntent()));
        } else {
            webView.restoreState(savedInstanceState);
        }
    }

    private void configureWebView() {
        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);
        settings.setGeolocationEnabled(true);
        settings.setUseWideViewPort(true);
        settings.setLoadWithOverviewMode(false);
        settings.setMediaPlaybackRequiresUserGesture(false);
        settings.setAllowFileAccess(false);
        settings.setAllowContentAccess(true);
        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
        settings.setUserAgentString(settings.getUserAgentString() + " EntraideMondeAndroid/1.0");

        CookieManager cookies = CookieManager.getInstance();
        cookies.setAcceptCookie(true);
        cookies.setAcceptThirdPartyCookies(webView, true);

        webView.setWebViewClient(new WebViewClient() {
            @Override
            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                Uri uri = request.getUrl();
                String scheme = uri.getScheme() == null ? "" : uri.getScheme();
                String host = uri.getHost() == null ? "" : uri.getHost();

                if (("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme))
                        && APP_HOST.equalsIgnoreCase(host)) {
                    return false;
                }

                if ("about".equalsIgnoreCase(scheme)) {
                    return false;
                }

                try {
                    startActivity(new Intent(Intent.ACTION_VIEW, uri));
                } catch (ActivityNotFoundException ignored) {
                }
                return true;
            }

            @Override
            public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                if (!request.isForMainFrame()) return;

                String html = "<!doctype html><html lang='fr'><meta name='viewport' content='width=device-width,initial-scale=1'>"
                        + "<body style='font-family:sans-serif;background:#f4f7f5;color:#18211d;padding:32px'>"
                        + "<h2 style='color:#35104f'>Entraide Monde</h2>"
                        + "<p>Impossible de charger la plateforme. Vérifiez votre connexion Internet.</p>"
                        + "<button style='padding:12px 18px;border:0;border-radius:10px;background:#137657;color:white;font-weight:700' "
                        + "onclick='location.href=\"" + APP_URL + "\"'>Réessayer</button></body></html>";
                view.loadDataWithBaseURL(APP_URL, html, "text/html", "UTF-8", null);
            }
        });

        webView.setWebChromeClient(new WebChromeClient() {
            @Override
            public boolean onShowFileChooser(
                    WebView view,
                    ValueCallback<Uri[]> newCallback,
                    FileChooserParams params
            ) {
                if (fileCallback != null) fileCallback.onReceiveValue(null);
                fileCallback = newCallback;

                Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                intent.addCategory(Intent.CATEGORY_OPENABLE);
                intent.setType("*/*");

                String[] accept = params.getAcceptTypes();
                List<String> mimeTypes = new ArrayList<>();
                if (accept != null) {
                    for (String type : accept) {
                        if (type != null && !type.trim().isEmpty() && type.contains("/")) {
                            mimeTypes.add(type);
                        }
                    }
                }
                if (!mimeTypes.isEmpty()) {
                    intent.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes.toArray(new String[0]));
                }
                intent.putExtra(
                        Intent.EXTRA_ALLOW_MULTIPLE,
                        params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE
                );

                try {
                    startActivityForResult(intent, REQ_FILES);
                    return true;
                } catch (ActivityNotFoundException e) {
                    fileCallback = null;
                    return false;
                }
            }

            @Override
            public void onPermissionRequest(PermissionRequest request) {
                runOnUiThread(() -> handleWebPermissionRequest(request));
            }

            @Override
            public void onGeolocationPermissionsShowPrompt(
                    String origin,
                    GeolocationPermissions.Callback callback
            ) {
                if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                        == PackageManager.PERMISSION_GRANTED) {
                    callback.invoke(origin, true, false);
                    return;
                }

                pendingGeoOrigin = origin;
                pendingGeoCallback = callback;
                requestPermissions(
                        new String[]{Manifest.permission.ACCESS_FINE_LOCATION},
                        REQ_LOCATION
                );
            }
        });

        webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
            try {
                startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
            } catch (ActivityNotFoundException ignored) {
            }
        });
    }

    private void handleWebPermissionRequest(PermissionRequest request) {
        List<String> androidPermissions = new ArrayList<>();

        for (String resource : request.getResources()) {
            if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)
                    && checkSelfPermission(Manifest.permission.CAMERA)
                    != PackageManager.PERMISSION_GRANTED) {
                androidPermissions.add(Manifest.permission.CAMERA);
            }

            if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)
                    && checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                    != PackageManager.PERMISSION_GRANTED) {
                androidPermissions.add(Manifest.permission.RECORD_AUDIO);
            }
        }

        if (androidPermissions.isEmpty()) {
            request.grant(request.getResources());
            return;
        }

        pendingMediaRequest = request;
        requestPermissions(androidPermissions.toArray(new String[0]), REQ_MEDIA);
    }

    @Override
    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults);

        if (requestCode == REQ_LOCATION && pendingGeoCallback != null) {
            boolean granted = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                    == PackageManager.PERMISSION_GRANTED;
            pendingGeoCallback.invoke(pendingGeoOrigin, granted, false);
            pendingGeoCallback = null;
            pendingGeoOrigin = null;
            return;
        }

        if (requestCode == REQ_MEDIA && pendingMediaRequest != null) {
            List<String> grantedResources = new ArrayList<>();

            for (String resource : pendingMediaRequest.getResources()) {
                if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)
                        && checkSelfPermission(Manifest.permission.CAMERA)
                        == PackageManager.PERMISSION_GRANTED) {
                    grantedResources.add(resource);
                }

                if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)
                        && checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                        == PackageManager.PERMISSION_GRANTED) {
                    grantedResources.add(resource);
                }
            }

            if (grantedResources.isEmpty()) {
                pendingMediaRequest.deny();
            } else {
                pendingMediaRequest.grant(grantedResources.toArray(new String[0]));
            }

            pendingMediaRequest = null;
        }
    }

    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        if (requestCode == REQ_FILES && fileCallback != null) {
            Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
            fileCallback.onReceiveValue(results);
            fileCallback = null;
            return;
        }
        super.onActivityResult(requestCode, resultCode, data);
    }

    @Override
    protected void onSaveInstanceState(Bundle outState) {
        webView.saveState(outState);
        super.onSaveInstanceState(outState);
    }

    @Override
    public void onBackPressed() {
        if (webView != null && webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }

    @Override
    protected void onDestroy() {
        if (webView != null) {
            webView.stopLoading();
            webView.setWebChromeClient(null);
            webView.setWebViewClient(null);
            webView.destroy();
        }
        super.onDestroy();
    }
}

          EOF_JAVA
          cat > entraide/app/src/main/res/values/styles.xml <<'EOF_STYLES'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="Theme.EntraideMonde" parent="@android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:navigationBarColor">#F4F7F5</item>
              <item name="android:statusBarColor">#35104F</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:colorAccent">#137657</item>
            </style>
          </resources>
          EOF_STYLES
          cat > entraide/app/src/main/res/drawable/ic_launcher.xml <<'EOF_ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#137657" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M54,21C35.8,21 21,35.8 21,54s14.8,33 33,33 33,-14.8 33,-33S72.2,21 54,21z"/>
            <path android:fillColor="#137657" android:pathData="M54,72.5l-3.6,-3.3C37.6,57.6 29,49.8 29,40.3 29,32.6 35.1,27 42.7,27c4.3,0 8.5,2 11.3,5.2C56.8,29 61,27 65.3,27 72.9,27 79,32.6 79,40.3c0,9.5 -8.6,17.3 -21.4,28.9z"/>
          </vector>
          EOF_ICON
      - name: Build APK and AAB
        working-directory: entraide
        run: |
          gradle --no-daemon :app:assembleDebug :app:bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Entraide-Monde.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/Entraide-Monde-PlayStore-unsigned.aab
      - name: Verify identity and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Entraide-Monde.apk | head -12
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Entraide-Monde.apk
          sha256sum dist/Entraide-Monde.apk dist/Entraide-Monde-PlayStore-unsigned.aab | tee dist/SHA256SUMS.txt
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: entraide-monde-final-app-links
          path: dist/
          retention-days: 30
