      - name: Build APK and Play Store bundle
        working-directory: entraide
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease
          mkdir -p ../dist
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Entraide Monde Android,O=AIAC,C=CM"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="../dist/Entraide-Monde-aligned-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out ../dist/Entraide-Monde.apk \
            "$ALIGNED_APK"
          rm -f "$ALIGNED_APK"
          cp app/build/outputs/bundle/release/app-release.aab ../dist/Entraide-Monde-PlayStore-unsigned.aab

      - name: Verify version identity logo and signature
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging dist/Entraide-Monde.apk | tee dist/aapt-badging.txt
          grep -q "package: name='org.aiac.entraidemonde'" dist/aapt-badging.txt
          grep -q "versionCode='4'" dist/aapt-badging.txt
          grep -q "versionName='1.0.4'" dist/aapt-badging.txt
          "$APKSIGNER" verify --verbose --print-certs dist/Entraide-Monde.apk | tee dist/apksigner.txt
          CERT_HEX="$(grep -i 'Signer #1 certificate SHA-256 digest:' dist/apksigner.txt | head -1 | sed 's/.*: //' | tr '[:lower:]' '[:upper:]')"
          CERT_COLON="$(printf '%s' "$CERT_HEX" | sed 's/../&:/g;s/:$//')"
          printf '%s\n' "$CERT_COLON" > dist/CERT_FINGERPRINT_SHA256.txt
          sha256sum dist/Entraide-Monde.apk dist/Entraide-Monde-PlayStore-unsigned.aab | tee dist/SHA256SUMS.txt
          unzip -l dist/Entraide-Monde.apk > dist/apk-listing.txt
          grep -q 'res/drawable' dist/apk-listing.txt
          ls -lh dist

      - name: Publish verified 1.0.4 binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published-final-v104
          cp dist/Entraide-Monde.apk published-final-v104/Entraide-Monde.apk
          cp dist/Entraide-Monde-PlayStore-unsigned.aab published-final-v104/Entraide-Monde-PlayStore-unsigned.aab
          cp dist/SHA256SUMS.txt published-final-v104/SHA256SUMS.txt
          cp dist/CERT_FINGERPRINT_SHA256.txt published-final-v104/CERT_FINGERPRINT_SHA256.txt
          cp dist/aapt-badging.txt published-final-v104/aapt-badging.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-final-v104/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish verified Entraide Monde Android 1.0.4 [skip ci]"
            git push origin HEAD:entraide-android-runner-probe
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: entraide-monde-android-1.0.4
          path: dist/
          retention-days: 30
