name: Entraide Final Lightweight Android Build
on:
  push:
    branches: [entraide-android-runner-probe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Create Android project
        run: |
          mkdir -p entraide/app/src/main/java/org/aiac/entraidemonde
          mkdir -p entraide/app/src/main/res/values
          mkdir -p entraide/app/src/main/res/drawable
          cat > entraide/settings.gradle.kts <<'EOF_SETTINGS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EntraideMonde"
          include(":app")
          EOF_SETTINGS
          cat > entraide/build.gradle.kts <<'EOF_ROOT'
          plugins { id("com.android.application") version "8.7.3" apply false }
          EOF_ROOT
          cat > entraide/gradle.properties <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_PROPS
          cat > entraide/app/build.gradle.kts <<'EOF_APP'
          plugins { id("com.android.application") }
          android {
              namespace = "org.aiac.entraidemonde"
              compileSdk = 35
              defaultConfig {
                  applicationId = "org.aiac.entraidemonde"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.0.2"
              }
              buildTypes {
                  debug {
                      applicationIdSuffix = ""
                      versionNameSuffix = "-test"
                  }
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }
          EOF_APP
          cat > entraide/app/proguard-rules.pro <<'EOF_PROGUARD'
          -keep class org.aiac.entraidemonde.MainActivity { *; }
          EOF_PROGUARD
          echo '' | base64 -d > entraide/app/src/main/AndroidManifest.xml
          echo '' | base64 -d > entraide/app/src/main/java/org/aiac/entraidemonde/MainActivity.java
          cat > entraide/app/src/main/res/values/styles.xml <<'EOF_STYLES'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="Theme.EntraideMonde" parent="@android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:navigationBarColor">#F4F7F5</item>
              <item name="android:statusBarColor">#35104F</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:colorAccent">#137657</item>
            </style>
          </resources>
          EOF_STYLES
          cat > entraide/app/src/main/res/drawable/ic_launcher.xml <<'EOF_ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#137657" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M54,21C35.8,21 21,35.8 21,54s14.8,33 33,33 33,-14.8 33,-33S72.2,21 54,21z"/>
            <path android:fillColor="#137657" android:pathData="M54,72.5l-3.6,-3.3C37.6,57.6 29,49.8 29,40.3 29,32.6 35.1,27 42.7,27c4.3,0 8.5,2 11.3,5.2C56.8,29 61,27 65.3,27 72.9,27 79,32.6 79,40.3c0,9.5 -8.6,17.3 -21.4,28.9z"/>
          </vector>
          EOF_ICON
      - name: Build APK and AAB
        working-directory: entraide
        run: |
          gradle --no-daemon :app:assembleDebug :app:bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Entraide-Monde.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/Entraide-Monde-PlayStore-unsigned.aab
      - name: Verify identity and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Entraide-Monde.apk | head -12
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Entraide-Monde.apk
          sha256sum dist/Entraide-Monde.apk dist/Entraide-Monde-PlayStore-unsigned.aab | tee dist/SHA256SUMS.txt
          ls -lh dist
      - name: Publish exact signed build for private transfer
        run: |
          mkdir -p published-final
          cp dist/Entraide-Monde.apk published-final/Entraide-Monde.apk
          cp dist/Entraide-Monde-PlayStore-unsigned.aab published-final/Entraide-Monde-PlayStore-unsigned.aab
          cp dist/SHA256SUMS.txt published-final/SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-final/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish exact Entraide App Links binaries [skip ci]"
            git push origin HEAD:entraide-android-runner-probe
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: entraide-monde-final-app-links
          path: dist/
          retention-days: 30
